schema_version: 1

context:
  name: tinyxml
  version: "2.6.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://downloads.sourceforge.net/project/tinyxml/tinyxml/2.6.2/tinyxml_2_6_2.tar.gz
    sha256: 15bdfdcec58a7da30adc87ac2b078e4417dbe5392f3afb719f9ba6d062645593
    patches:
      # These two patches are taken from the debian packaging of tinyxml.
      #   The first patch enforces use of stl strings, rather than a custom string type.
      #   The second patch is a fix for incorrect encoding of elements with special characters
      #   originally posted at https://sourceforge.net/p/tinyxml/patches/51/
      - enforce-use-stl.patch
      - entity-encoding.patch
  # This adds a CMakeLists.txt file to build a shared library and provide an install target
  # submitted upstream as https://sourceforge.net/p/tinyxml/patches/66/
  - path: CMakeLists.txt
  - path: tinyxml.pc.in

build:
  number: 3

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make
  run_exports:
    - tinyxml

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/lib/lib${{ name }}$SHLIB_EXT
      - if: unix
        then: test -f $PREFIX/lib/pkgconfig/${{ name }}.pc
      - if: win
        then: if exist %PREFIX%\\Library\\bin\\${{ name }}%SHLIB_EXT% (exit 0) else (exit 1)
      - if: win
        then: if exist %PREFIX%\\Library\\lib\\pkgconfig\${{ name }}.pc (exit 0) else (exit 1)

about:
  license: Zlib
  license_file: LICENSE
  summary: A simple, small, C++ XML parser that can be easily integrated into other programs
  homepage: http://www.grinninglizard.com/tinyxml
  repository: https://www.sourceforge.net/projects/tinyxml

extra:
  recipe-maintainers:
    - traversaro
    - jcarpent
    - wolfv
    - lesteve
